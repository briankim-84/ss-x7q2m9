<style>
:root{
  --ink:#000; --shell:#0b0b0c; --paper:#fff;
  --mute:rgba(255,255,255,.60); --dim:rgba(255,255,255,.38); --line:rgba(255,255,255,.13);
  --mark:#ffe066; --heart:#ff3b5c;
  --en:'Archivo',system-ui,sans-serif;
  --kr:'Pretendard Variable',Pretendard,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#141416;font-family:var(--kr);color:var(--paper);
  display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--mark);outline-offset:3px;border-radius:4px}

.phone{position:relative;width:min(430px,100vw);height:min(920px,100vh);height:min(920px,100dvh);
  background:var(--ink);border-radius:30px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07)}
@media (max-width:520px){.phone{border-radius:0;box-shadow:none;width:100vw;height:100vh;height:100dvh}}

.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.clip{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}

.vid{position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:100%;aspect-ratio:9/16;object-fit:cover;background:var(--ink);display:block}
.scrim{position:absolute;left:0;right:0;top:0;height:24%;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.62),transparent)}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.14);z-index:5}
.prog i{display:block;height:100%;width:0;background:var(--paper)}

.tapzone{position:absolute;inset:0;z-index:2}
.pausebadge{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);
  width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;
  opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:3}
.clip.paused .pausebadge{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pausebadge svg{width:26px;height:26px;fill:var(--paper)}

/* 상단 */
.top{position:absolute;top:0;left:0;right:0;z-index:6;padding-top:calc(10px + env(safe-area-inset-top))}
.bar{display:flex;align-items:baseline;gap:9px;padding:0 16px 10px}
.wordmark{font-family:var(--en);font-weight:800;font-size:19px;font-stretch:112%;letter-spacing:-.01em}
.wordmark b{color:var(--mark)}
.tagline{font-size:11px;color:var(--dim)}
.acct{display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;min-height:46px}
.acct .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.acct .name{display:flex;align-items:center;gap:4px;font-family:var(--en);font-size:14px;
  font-weight:700;letter-spacing:-.015em;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.verified{width:13px;height:13px;flex:none}
.acct .sub{font-size:11.5px;color:rgba(255,255,255,.72);letter-spacing:-.02em;
  text-shadow:0 1px 4px rgba(0,0,0,.55)}
.dots{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.dots svg{width:18px;height:18px;fill:var(--paper)}
.avatar{border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(from 210deg,#ffe066,#ff8a5c,#e6478f,#7a5cff,#ffe066);
  width:var(--s,34px);height:var(--s,34px);padding:2px}
.avatar i{width:100%;height:100%;border-radius:50%;background:#141417;display:grid;place-items:center;
  font-family:var(--en);font-size:calc(var(--s,34px)*.34);font-weight:800;font-style:normal}

/* 우측 레일 */
.rail{position:absolute;right:10px;z-index:6;bottom:var(--rail-bottom,300px);
  display:flex;flex-direction:column;align-items:center;gap:19px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px}
.rail svg{width:26px;height:26px;stroke:var(--paper);stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.rail span{font-family:var(--en);font-size:10.5px;font-weight:600;
  color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.rail .save[aria-pressed="true"] svg{stroke:var(--mark);fill:rgba(255,224,102,.9)}
.like{position:relative}
.like svg{transition:transform .16s cubic-bezier(.34,1.6,.5,1)}
.like.on svg{stroke:var(--heart);fill:var(--heart)}
.like.pop svg{transform:scale(1.28)}
.like.on .count{color:#ff7a90}
.floats{position:absolute;bottom:26px;left:50%;width:0;height:0;pointer-events:none}
.floats svg{position:absolute;width:20px;height:20px;left:-10px;stroke:none;fill:var(--heart);
  opacity:0;animation:rise 1.1s ease-out forwards}
@keyframes rise{
  0%{opacity:0;transform:translate(0,0) scale(.5)}
  18%{opacity:.95}
  100%{opacity:0;transform:translate(var(--x,0),-96px) scale(1.15)}
}

/* 소리 켜기 안내 */
.soundhint{position:absolute;left:50%;transform:translateX(-50%);z-index:7;
  top:calc(100px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:rgba(20,20,22,.72);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:12.5px;font-weight:600;letter-spacing:-.02em;transition:opacity .25s}
.soundhint svg{width:15px;height:15px;stroke:var(--mark);stroke-width:1.8;fill:none}
.soundhint.gone{opacity:0;pointer-events:none}

/* 하단 — 영상 밴드 아래에서 시작 */
.lower{position:absolute;left:0;right:0;bottom:0;top:var(--lower-top,62%);z-index:6;
  display:flex;flex-direction:column;
  padding:0 14px calc(12px + env(safe-area-inset-bottom))}
.subs{flex:none;min-height:56px;display:flex;flex-direction:column;justify-content:center;
  padding:6px 4px 8px;text-align:center}
.subs .en{font-family:var(--en);font-size:16px;font-weight:500;letter-spacing:-.005em;
  line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.subs .ko{font-size:15px;font-weight:500;letter-spacing:-.02em;
  line-height:1.4;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.subs[data-mode="off"]{opacity:0}

.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);flex:none;
  width:222px;margin:0 auto 12px;padding:3px;
  background:rgba(20,20,22,.62);border:1px solid var(--line);border-radius:999px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg .thumb{position:absolute;top:3px;left:3px;width:calc((100% - 6px)/3);height:calc(100% - 6px);
  background:var(--mark);border-radius:999px;transition:transform .26s cubic-bezier(.34,1.4,.5,1)}
.seg button{position:relative;z-index:1;padding:7px 0;font-size:12.5px;font-weight:600;
  letter-spacing:-.02em;color:var(--mute);transition:color .18s}
.seg button[aria-selected="true"]{color:#141416}

.sheet{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.hearts{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:-.02em;
  margin-bottom:5px;font-variant-numeric:tabular-nums}
.cap{font-size:13.5px;line-height:1.5;letter-spacing:-.015em}
.cap .who{font-family:var(--en);font-weight:700;font-size:13.5px;margin-right:5px}
.cap .tags{font-family:var(--en);font-weight:500;color:#9cc0ff}
.more{font-size:13px;color:var(--dim);margin-top:5px;letter-spacing:-.02em}
.picks{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.picks.hidden{display:none}
.picks h3{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--dim);margin-bottom:11px}
.pick{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.pick:last-child{border-bottom:0;padding-bottom:2px}
.chunk{display:inline;font-family:var(--en);font-size:16.5px;font-weight:700;letter-spacing:-.015em;
  background:linear-gradient(to top,rgba(255,224,102,.28) 0 38%,transparent 38%);
  box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 2px}
.gloss{margin-top:5px;font-size:13px;color:rgba(255,255,255,.82);letter-spacing:-.02em}
.note{margin-top:3px;font-size:11.5px;color:var(--dim);letter-spacing:-.02em}

.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="phone"><div class="feed" id="feed"><div class="loading">불러오는 중…</div></div></div>

<script type="module">
const FIREBASE = {
  apiKey: "AIzaSyDCbjrZDn-AQWwF1HJVNEGYwB9j58nAEUc",
  authDomain: "ss-x7q2m9.firebaseapp.com",
  databaseURL: "https://ss-x7q2m9-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ss-x7q2m9",
  storageBucket: "ss-x7q2m9.firebasestorage.app",
  messagingSenderId: "305358438157",
  appId: "1:305358438157:web:e9c8e5b8a2ba25c548ba44"
};

const HEART='<path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1Z"/>';
const VERIFIED='<svg class="verified" viewBox="0 0 24 24" aria-label="인증됨"><circle cx="12" cy="12" r="11" fill="#3897f0"/><path d="M7 12.4l3.2 3.1L17 8.8" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DOTS='<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>';
const ICON={
  save:'<path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1Z"/>',
  share:'<path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7Z"/>',
  soundOn:'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/>',
  soundOff:'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/>',
  pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'
};
const nf=n=>n.toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const mem={};
const store={
  get(k){ try{ return localStorage.getItem(k) ?? mem[k] ?? null; }catch{ return mem[k] ?? null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch{} }
};
const myTaps=id=>+(store.get("ss:my:"+id)||0);

let FEED=null, MODE="ko", SOUND=false;   /* 더보기는 클립마다 따로 (el._open) */
const MODES=["ko","en","off"];
const server={}, pending={};
const total=id=>(server[id]||0)+(pending[id]||0);

let db=null,dbApi=null,flushTimer=null;

boot();

async function boot(){
  const res=await fetch("feed.json",{cache:"no-cache"});
  FEED=await res.json();
  FEED.clips.forEach(c=>{ server[c.id]=0; pending[c.id]=0; });
  render();
  connect();
}

function render(){
  document.getElementById("feed").innerHTML = FEED.clips.map((c,i)=>`
<section class="clip" data-i="${i}" data-id="${c.id}"
         style="--lower-top:${(c.band.bottom*100).toFixed(2)}%">
  <video class="vid" data-src="${c.src}" playsinline webkit-playsinline loop muted preload="none" disablepictureinpicture></video>
  <div class="scrim"></div>
  <button class="tapzone" aria-label="재생 또는 일시정지"></button>
  <div class="pausebadge"><svg viewBox="0 0 24 24">${ICON.pause}</svg></div>
  <div class="prog"><i></i></div>

  <header class="top">
    <div class="bar"><span class="wordmark">S<b>&amp;</b>S</span><span class="tagline">넘기면서 배우는 영어</span></div>
    <div class="acct">
      <span class="avatar" style="--s:34px"><i>B</i></span>
      <span class="meta">
        <span class="name">${FEED.handle}${VERIFIED}</span>
        <span class="sub">${esc(c.source)}</span>
      </span>
      <button class="dots" aria-label="옵션">${DOTS}</button>
    </div>
  </header>

  <button class="soundhint"><svg viewBox="0 0 24 24">${ICON.soundOn}</svg>탭하면 소리가 켜집니다</button>

  <div class="rail">
    <button class="like" aria-label="좋아요">
      <span class="floats"></span>
      <svg viewBox="0 0 24 24">${HEART}</svg><span class="count">0</span>
    </button>
    <button class="save" aria-pressed="false" aria-label="표현 저장"><svg viewBox="0 0 24 24">${ICON.save}</svg><span>저장</span></button>
    <button class="sound" aria-pressed="false" aria-label="소리"><svg viewBox="0 0 24 24">${ICON.soundOff}</svg><span>소리</span></button>
    <button class="share" aria-label="공유"><svg viewBox="0 0 24 24">${ICON.share}</svg><span>공유</span></button>
  </div>

  <div class="lower">
    <div class="subs" data-mode="${MODE}"><div class="line"></div></div>
    <div class="seg" role="tablist" aria-label="자막 설정">
      <span class="thumb"></span>
      <button role="tab" data-mode="ko" aria-selected="true">한글</button>
      <button role="tab" data-mode="en" aria-selected="false">영어</button>
      <button role="tab" data-mode="off" aria-selected="false">무자막</button>
    </div>
    <div class="sheet">
      <p class="hearts">하트 0개</p>
      <p class="cap"><span class="who">${FEED.handle}</span><span class="tags">${c.tags.join(" ")}</span></p>
      <button class="more">더보기</button>
      <div class="picks">
        <h3>핵심 표현 ${c.picks.length}</h3>
        ${c.picks.map(p=>`
          <div class="pick">
            <span class="chunk">${esc(p.chunk)}</span>
            <div class="gloss">${esc(p.ko)}</div>
            ${p.note?`<div class="note">${esc(p.note)}</div>`:""}
          </div>`).join("")}
      </div>
    </div>
  </div>
</section>`).join("");

  document.querySelectorAll(".clip").forEach(bind);
  document.querySelectorAll(".clip").forEach(el=>io.observe(el));
  window.addEventListener("resize",layoutAll);
  layoutAll(); syncUI();
}

function bind(el){
  const v=el.querySelector("video");
  el._open=false;   /* 클립마다 접힌 상태로 시작 */
  el.querySelectorAll(".seg button").forEach(b=>
    b.addEventListener("click",()=>{ MODE=b.dataset.mode; syncUI(); }));
  el.querySelector(".more").addEventListener("click",()=>{ el._open=!el._open; paintPicks(el); });
  el.querySelector(".like").addEventListener("click",e=>tapLike(e.currentTarget,el));
  el.querySelector(".save").addEventListener("click",e=>{
    const b=e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="false");
  });
  el.querySelector(".sound").addEventListener("click",()=>setSound(!SOUND));
  el.querySelector(".soundhint").addEventListener("click",()=>setSound(true));
  el.querySelector(".tapzone").addEventListener("click",()=>{
    if(!SOUND){ setSound(true); return; }
    if(v.paused){ v.play().catch(()=>{}); el.classList.remove("paused"); }
    else { v.pause(); el.classList.add("paused"); }
  });
  v.addEventListener("timeupdate",()=>{
    paint(el);
    const p=el.querySelector(".prog i");
    if(v.duration) p.style.width=(v.currentTime/v.duration*100)+"%";
  });
}

function cueAt(c,t){
  let found=null;
  for(const q of c.cues){ if(t>=q.t) found=q; else break; }
  return found;
}
function paint(el){
  const c=FEED.clips[+el.dataset.i], v=el.querySelector("video");
  const box=el.querySelector(".subs"), line=box.querySelector(".line");
  box.dataset.mode=MODE;
  if(MODE==="off"){ line.textContent=""; return; }
  const q=cueAt(c,v.currentTime||0);
  line.className="line "+MODE;
  line.textContent=q?q[MODE]:"";
}
function layoutAll(){
  document.querySelectorAll(".clip").forEach(el=>{
    const h=el.clientHeight, lowerTop=el.querySelector(".lower").offsetTop;
    el.querySelector(".rail").style.setProperty("--rail-bottom",(h-lowerTop+10)+"px");
  });
}
function paintPicks(el){
  el.querySelector(".picks").classList.toggle("hidden",!el._open);
  el.querySelector(".more").textContent = el._open ? "접기" : "더보기";
}
function syncUI(){
  document.querySelectorAll(".clip").forEach(el=>{
    el.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===MODE));
    el.querySelector(".seg .thumb").style.transform=`translateX(${MODES.indexOf(MODE)*100}%)`;
    paintPicks(el);
    el.querySelector(".sound").querySelector("svg").innerHTML=SOUND?ICON.soundOn:ICON.soundOff;
    el.querySelector(".sound").setAttribute("aria-pressed",SOUND);
    el.querySelector(".soundhint").classList.toggle("gone",SOUND);
    paint(el);
  });
  renderCounts();
}
let unlocked=false;
function unlockAll(){          /* 반드시 사용자 탭 안에서 호출 */
  if(unlocked) return; unlocked=true;
  document.querySelectorAll(".clip").forEach(el=>{
    const v=el.querySelector("video");
    if(!v.src && v.dataset.src){ v.src=v.dataset.src; }
    const p=v.play();
    if(p&&p.then) p.then(()=>{ if(!el.classList.contains("live")) v.pause(); }).catch(()=>{});
  });
}
function setSound(on){
  SOUND=on;
  unlockAll();
  document.querySelectorAll("video").forEach(v=>{ v.muted=!on; });
  const live=document.querySelector(".clip.live video");
  if(live){ live.muted=!on; live.play().catch(()=>{}); }
  syncUI();
}
function renderCounts(){
  document.querySelectorAll(".clip").forEach(el=>{
    const id=el.dataset.id;
    el.querySelector(".count").textContent=nf(total(id));
    el.querySelector(".like").classList.toggle("on",myTaps(id)>0);
    el.querySelector(".hearts").textContent=`하트 ${nf(total(id))}개`;
  });
}
function tapLike(btn,el){
  const id=el.dataset.id;
  pending[id]++; store.set("ss:my:"+id,myTaps(id)+1);
  renderCounts(); scheduleFlush();
  btn.classList.add("pop"); setTimeout(()=>btn.classList.remove("pop"),160);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const w=document.createElement("span");
  w.innerHTML=`<svg viewBox="0 0 24 24">${HEART}</svg>`;
  const s=w.firstChild;
  s.style.setProperty("--x",(Math.random()*46-23).toFixed(0)+"px");
  s.style.animationDuration=(0.9+Math.random()*0.5)+"s";
  btn.querySelector(".floats").appendChild(s);
  setTimeout(()=>s.remove(),1500);
}

let liveEl=null;
const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    const el=e.target, v=el.querySelector("video");
    if(e.intersectionRatio<.6){ if(el!==liveEl) v.pause(); return; }
    if(el===liveEl) return;        /* 이미 재생 중인 클립이면 건드리지 않음 */
    if(liveEl){
      const pv=liveEl.querySelector("video");
      liveEl.classList.remove("live"); pv.pause();
      try{ pv.currentTime=0; }catch(err){}
    }
    liveEl=el;
    el.classList.add("live"); el.classList.remove("paused");
    warm(+el.dataset.i);
    v.muted=!SOUND;
    if(v.currentTime>0.3){ try{ v.currentTime=0; }catch(err){} }
    const pr=v.play();
    if(pr&&pr.catch) pr.catch(()=>{ el.classList.add("paused"); });
    paint(el);
  });
},{threshold:[0,.6,1]});

function warm(i){
  [i,i+1].forEach(k=>{
    const el=document.querySelector(`.clip[data-i="${k}"]`);
    if(!el) return;
    const v=el.querySelector("video");
    if(!v.src && v.dataset.src){ v.src=v.dataset.src; v.load(); }
  });
}

async function connect(){
  try{
    const { initializeApp }=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const m=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
    db=m.getDatabase(initializeApp(FIREBASE)); dbApi=m;
    m.onValue(m.ref(db,"likes"),snap=>{
      const v=snap.val()||{};
      FEED.clips.forEach(c=>{ if(typeof v[c.id]==="number") server[c.id]=v[c.id]; });
      renderCounts();
    });
  }catch(e){ console.warn("좋아요 서버 연결 실패 — 이 브라우저 안에서만 셉니다.",e); }
}
function scheduleFlush(){
  clearTimeout(flushTimer);
  flushTimer=setTimeout(async()=>{
    if(!db) return;
    const patch={},sending={}; let any=false;
    for(const id in pending){ if(pending[id]>0){ patch["likes/"+id]=dbApi.increment(pending[id]); sending[id]=pending[id]; any=true; } }
    if(!any) return;
    try{
      await dbApi.update(dbApi.ref(db),patch);
      for(const id in sending) pending[id]-=sending[id];
    }catch(e){ console.warn("좋아요 전송 실패 — 다음 탭에서 다시 시도합니다.",e); }
  },1200);
}
